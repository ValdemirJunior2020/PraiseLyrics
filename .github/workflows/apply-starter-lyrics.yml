name: Apply starter worship library

on:
  push:
    paths:
      - '.github/workflows/apply-starter-lyrics.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch PraiseLyrics starter library
        run: python .github/scripts/apply_starter_lyrics.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git diff --cached --quiet && exit 0
          git commit -m "Load 50 starter worship lyrics"
          git push
